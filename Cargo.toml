[package]
name = "willai-c"
version = "0.1.0"
edition = "2024"
publish = false
description = "WillAI-C native Windows productivity workspace, implemented in Rust."

[dependencies]
windows-reactor = "=0.100.0"
windows-webview = { version = "=0.100.0", default-features = false, features = ["reactor"] }

[build-dependencies]
windows-reactor-setup = "=0.100.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
