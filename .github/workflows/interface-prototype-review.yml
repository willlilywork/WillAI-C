name: WillAI-C interface prototype review
on:
  push:
    branches:
      - design/workspace-first-interface
    paths:
      - 'prototype/interface/index.html'
      - 'prototype/interface/check.mjs'
      - 'prototype/interface/capture-review.mjs'
      - 'prototype/interface/package.json'
      - '.github/workflows/interface-prototype-review.yml'
permissions:
  contents: write
jobs:
  prototype-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype dependencies
        working-directory: prototype/interface
        run: npm install
      - name: Install Chromium
        working-directory: prototype/interface
        run: npx playwright install --with-deps chromium
      - name: Check prototype source
        working-directory: prototype/interface
        run: npm run check
      - name: Capture screen and responsive review set
        working-directory: prototype/interface
        run: npm run screenshots
      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: willai-c-interface-review-${{ github.run_number }}
          path: prototype/interface/review/screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Commit screenshots to design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/interface/review/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: add interface prototype review screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
