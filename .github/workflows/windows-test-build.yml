name: WillAI-C Windows test build

on:
  push:
    branches:
      - main
      - rebuild/desktop-first-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Build and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Type-check application
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      - name: Check Electron entry points
        shell: pwsh
        run: |
          node --check src/main/index.cjs
          node --check src/main/browser.cjs
          node --check src/main/preload.cjs
          node --check src/main/provider-capture-preload.cjs
          node --check src/main/markdown-nodes.cjs

      - name: Rebuild SQLite native module for Electron
        run: npm run rebuild:electron

      - name: Package Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Filter *.exe
          if (-not $files) {
            throw "No Windows installer was produced."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WillAI-C-Windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const files = fs.readdirSync('release')
              .filter(name => name.toLowerCase().endsWith('.exe') || name === 'SHA256SUMS.txt');

            if (!files.some(name => name.toLowerCase().endsWith('.exe'))) {
              throw new Error('No Windows installer found in release/.');
            }

            const tag = 'windows-test-' + context.runNumber;
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'WillAI-C Windows Test Build #' + context.runNumber,
              body: [
                'WillAI-C 0.3.0 workspace-organization build from ' + context.ref + '.',
                '',
                'Commit: ' + context.sha,
                '',
                '- Windows x64 NSIS installer. Version 0.3.0.',
                '- Includes folder drag-and-drop, nested folder moves, editable folder styling, and bulk conversation actions.',
                '- Unsigned test build; Windows may display a SmartScreen warning.',
                '- For evaluation only. Do not treat this as a production release.',
                '- Main is the acceptance branch; verify the installed application before treating this as a release.'
              ].join('\n'),
              draft: false,
              prerelease: true
            });

            for (const name of files) {
              const filePath = path.join('release', name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name,
                data,
                headers: {
                  'content-type': name.endsWith('.exe')
                    ? 'application/vnd.microsoft.portable-executable'
                    : 'text/plain',
                  'content-length': data.length
                }
              });
            }

            core.info('Published test release: ' + release.data.html_url);